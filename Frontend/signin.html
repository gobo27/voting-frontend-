<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Access | CampusVote</title>

  <link href="./dist/output.css" rel="stylesheet">
  <link href="./module/sheared/sigin.css" rel="stylesheet">
</head>

<body>

  <!-- HEADER -->
  <header class="staff-header">
    <a href="index.html" class="back-button" aria-label="Go back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round">
        <path d="m12 19-7-7 7-7"></path>
        <path d="M19 12H5"></path>
      </svg>
    </a>

    <div class="header-text">
      <h1>Staff Access</h1>
      <p>Secure Role-Based Authentication</p>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="staff-main">

    <section class="role-section">

      <div class="section-heading">
        <h2>Select Your Role</h2>
        <p>Choose Your Access Level to Continue</p>
      </div>

      <div class="role-grid">

        <!-- ADVISER -->
        <a href="module/adviser/Adviserlogin.html" class="role-card">

          <div class="role-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
              stroke-linejoin="round">
              <path
                d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z">
              </path>
              <path d="M22 10v6"></path>
              <path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"></path>
            </svg>
          </div>

          <h3>ADVISER</h3>
          <p>Manage and Oversee the overall election process</p>
        </a>

        <!-- COMMITTEE -->
        <a href="module/committee/Committeelogin.html" class="role-card">

          <div class="role-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
              stroke-linejoin="round">
              <path d="M18 21a8 8 0 0 0-16 0"></path>
              <circle cx="10" cy="8" r="5"></circle>
              <path d="M22 20c0-3.37-2-6.5-4-8a5 5 0 0 0-.45-8.3"></path>
            </svg>
          </div>

          <h3>COMMITTEE</h3>
          <p>Facilitate technical tasks and OMR scanning</p>
        </a>
        <!-- SUPER ADMIN -->
        <a href="module/SuperAdmin/SuperAdminlog.html" class="role-card">

          <div class="role-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
              stroke-linejoin="round">
              <path d="M2 21a8 8 0 0 1 10.434-7.62"></path>
              <circle cx="10" cy="8" r="5"></circle>
              <circle cx="18" cy="18" r="3"></circle>
              <path d="m19.5 14.3-.4.9"></path>
              <path d="m16.9 20.8-.4.9"></path>
              <path d="m21.7 19.5-.9-.4"></path>
              <path d="m15.2 16.9-.9-.4"></path>
              <path d="m21.7 16.5-.9.4"></path>
              <path d="m15.2 19.1-.9.4"></path>
              <path d="m19.5 21.7-.4-.9"></path>
              <path d="m16.9 15.2-.4-.9"></path>
            </svg>
          </div>
          <h3>SUPER ADMIN</h3>
          <p>Full system access and configuration.</p>
        </a>
      </div>
    </section>
  </main>
</body>

</html>
