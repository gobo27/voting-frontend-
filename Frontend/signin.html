<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Access</title>
  <link href="./dist/output.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-black text-[#efefef] font-sans antialiased flex flex-col">


<header class="fixed top-0 left-0 right-0 z-50 w-full bg-[#8f0000] border-b border-[#8f0000] py-5 px-3 flex items-center gap-3 shadow-md">
    <a href="index.html" class="text-[#efefef] hover:opacity-80 transition">
      <svg xmlns="http://www.w3.org/2000/svg"width="40" height="38" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
    </a>
    <div class="flex flex-col">
      <h2 class="text-[20px]  font-bold text-[#efefef] font-serif leading-none">Staff Access</h2>
      <p class="text-[15px] text-[#efefef]/90 font-light font-serif mt-1">Secure Role-based Authentication</p>
    </div>
  </header>

  <main 
    class="relative flex-1 w-full bg-cover bg-center flex flex-col items-center justify-center p-6 pt-1 md:p-12 overflow-hidden"
    style="background-image: url('image/bg4.jpg');"
  >

    <div class="relative z-10 text-center mb-8 md:mb-12">
      <h1 class="text-3xl md:text-5xl font-serif font-bold text-[#efefef] drop-shadow-md">
        Select Your Role
      </h1>
      <p class="text-[18px] text-[#efefef] font-light mt-2 drop-shadow font-serif">
        Choose Your Access level to Continue
      </p>
    </div>


    <div class="pt-19 relative z-10 grid grid-cols-1 md:grid-cols-3 gap-15 w-full max-w-6xl px-4">
      
      <a 
        href="adviser/Adviserlogin.html" 
        class="group bg-[#efefef] text-gray-800 rounded-2xl p-6 flex flex-col items-center text-center shadow-2xl hover:-translate-y-2 transition duration-300 border-l-8 border-[#700000] cursor-pointer"
      >
        <div class="w-16 h-16 rounded-full border-2 border-[#8f0000] flex items-center justify-center text-[#8f0000] mb-4 group-hover:bg-[#710000] group-hover:text-[#efefef] transition">
          <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"></path><path d="M22 10v6"></path><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"></path></svg>
        </div>
        <h3 class="text-xl font-bold tracking-wide text-[#8f0000] mb-2 font-serif">ADVISER</h3>
        <p class="text-[15px] text-gray-600 leading-relaxed font-serif">
          Manage and Oversee the overall election process
        </p>
      </a>

      <a 
        href="committee/Committeelogin.html" 
        class="group bg-[#efefef] text-gray-800 rounded-2xl p-6 flex flex-col items-center text-center shadow-2xl hover:-translate-y-1 transition duration-300 border-l-8 border-[#700000] cursor-pointer"
      >
        <div class="w-16 h-16 rounded-full border-2 border-[#8f0000] flex items-center justify-center text-[#8f0000] mb-4 group-hover:bg-[#710000] group-hover:text-[#efefef] transition">
          <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 21a8 8 0 0 0-16 0"></path><circle cx="10" cy="8" r="5"></circle><path d="M22 20c0-3.37-2-6.5-4-8a5 5 0 0 0-.45-8.3"></path></svg>
        </div>
        <h3 class="text-xl font-bold tracking-wide text-[#8f0000] mb-2 font-serif">COMMITTEE</h3>
        <p class="text-[15px] text-gray-600 leading-relaxed font-serif">
          Facilitate technical tasks and OMR scanning
        </p>
      </a>

      <a 
        href="SuperAdmin/SuperAdminlog.html" 
        class="group bg-[#efefef] text-gray-800 rounded-2xl p-6 flex flex-col items-center text-center shadow-2xl hover:-translate-y-2 transition duration-300 border-l-8 border-[#700000] cursor-pointer"
      >
        <div class="w-16 h-16 rounded-full border-2 border-[#8f0000] flex items-center justify-center text-[#8f0000] mb-4 group-hover:bg-[#710000] group-hover:text-[#efefef] transition">
          <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 21a8 8 0 0 1 10.434-7.62"></path><circle cx="10" cy="8" r="5"></circle><circle cx="18" cy="18" r="3"></circle><path d="m19.5 14.3-.4.9"></path><path d="m16.9 20.8-.4.9"></path><path d="m21.7 19.5-.9-.4"></path><path d="m15.2 16.9-.9-.4"></path><path d="m21.7 16.5-.9.4"></path><path d="m15.2 19.1-.9.4"></path><path d="m19.5 21.7-.4-.9"></path><path d="m16.9 15.2-.4-.9"></path></svg>
        </div>
        <h3 class="text-xl font-bold tracking-wide text-[#8f0000] mb-2 font-serif">SUPER ADMIN</h3>
        <p class="text-[15px] text-gray-600 leading-relaxed font-serif">
          Full system access and configuration.
        </p>
      </a>

    </div>
  </main>

</body>
</html>
