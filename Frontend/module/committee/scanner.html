
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OMR Ballot Scanner</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;font:15px Arial,sans-serif;color:#222}
header{background:#800000;color:#fff;padding:20px 28px}
header h1{margin:0;font-size:23px}
main{max-width:1350px;margin:24px auto;padding:0 16px;display:grid;grid-template-columns:350px 1fr;gap:20px}
.panel{background:#fff;border-radius:12px;padding:20px;box-shadow:0 3px 15px #0001;min-width:0}
label{display:block;font-weight:bold;margin:16px 0 7px}
input,select{width:100%;padding:11px;border:1px solid #bbb;border-radius:7px;font:inherit}
button{border:0;border-radius:7px;padding:11px 15px;cursor:pointer;font-weight:bold}
.primary{background:#800000;color:white}
.secondary{background:#e5e7eb;color:#222}
button:disabled{opacity:.5;cursor:not-allowed}
.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.status{font-size:13px;line-height:1.5;white-space:pre-wrap}
.error{color:#a00000}
.success{color:#176b36}
#video{display:none;width:100%;max-height:320px;background:#111;margin-top:12px;border-radius:8px}
#scanCanvas{width:100%;height:auto;display:block;background:#eee;border:1px solid #ccc}
.canvas-wrap{overflow:auto;max-height:850px}
.result-position{border:1px solid #ddd;border-radius:8px;padding:12px;margin:12px 0}
.result-position h4{margin:0 0 8px}
.result-position ul{padding-left:20px;margin:8px 0}
.overvote{color:#a00000;font-weight:bold}
.valid{color:#176b36;font-weight:bold}
.note{font-size:13px;color:#555;line-height:1.5}
@media(max-width:900px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>OMR Ballot Scanner</h1></header>
<main>
<section class="panel">
<h2>Scanner Controls</h2>

<label for="electionId">Election ID</label>
<input id="electionId" type="number" min="1" value="1">

<div class="buttons">
<button id="loadBtn" class="secondary" type="button">Load Templates</button>
</div>

<label for="templateSelect">Ballot Template</label>
<select id="templateSelect">
<option value="">Select a template</option>
</select>
<p id="scannerStatus" class="status"></p>

<label for="fileInput">Upload Ballot Image</label>
<input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp">

<div class="buttons">
<button id="cameraBtn" class="secondary" type="button">Open Camera</button>
<button id="captureBtn" class="secondary" type="button" disabled>Capture</button>
<button id="stopCameraBtn" class="secondary" type="button" disabled>Stop Camera</button>
</div>

<video id="video" autoplay playsinline muted></video>
<p id="imageStatus" class="status"></p>

<div class="buttons">
<button id="analyzeBtn" class="primary" type="button" disabled>Analyze Ballot</button>
</div>
<p id="analysisStatus" class="status"></p>

<p class="note">
For two ballots per A4, cut or crop one half-ballot before scanning.
Keep all four black corner markers visible. Print at 100% scale.
</p>

<button id="submitBtn" class="secondary" type="button" disabled>
Submit Votes (Disabled During Testing)
</button>
</section>

<section class="panel">
<h2>Ballot Preview</h2>
<div class="canvas-wrap">
<canvas id="scanCanvas"></canvas>
</div>
<h2>Detected Results</h2>
<div id="results">
<p>No ballot analyzed yet.</p>
</div>
</section>
</main>
<script src="./scanner.js"></script>
</body>
</html>
