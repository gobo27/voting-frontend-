
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OMR Ballot Creator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f1f2f5;
    color: #222;
    font: 15px Arial, sans-serif;
}

header {
    background: #800000;
    color: white;
    padding: 20px 28px;
    font-size: 22px;
    font-weight: bold;
}

.layout {
    display: grid;
    grid-template-columns: 330px minmax(0, 1fr);
    gap: 20px;
    max-width: 1450px;
    margin: 24px auto;
    padding: 0 16px;
}

.panel {
    background: white;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 3px 14px #0001;
}

label {
    display: block;
    font-weight: bold;
    margin: 16px 0 6px;
}

input,
textarea,
select {
    width: 100%;
    border: 1px solid #bbb;
    border-radius: 7px;
    padding: 10px;
    font: inherit;
}

button {
    border: 0;
    border-radius: 8px;
    padding: 12px 16px;
    font-weight: bold;
    cursor: pointer;
}

.primary {
    background: #800000;
    color: white;
}

.secondary {
    background: #e5e7eb;
}

.buttons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 20px;
}

#status {
    margin-top: 15px;
    line-height: 1.5;
    white-space: pre-wrap;
}

#loadedCandidates {
    font-size: 13px;
    color: #555;
    line-height: 1.5;
}

#positionSettings {
    margin-top: 10px;
}

.preview {
    overflow: auto;
    background: #ddd;
    padding: 18px;
    border-radius: 8px;
}

#ballotPage {
    width: 210mm;
    height: 297mm;
    background: white;
    margin: auto;
    color: black;
    box-shadow: 0 2px 14px #0003;
    position: relative;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.ballot-half {
    width: 210mm;
    height: 148.5mm;
    position: relative;
    overflow: hidden;
    background: white;
}

.ballot-half.full {
    height: 297mm;
}

.ballot-half:not(.full):first-child {
    border-bottom: 0.25mm dashed #999;
}

.ballot-heading {
    position: absolute;
    top: 8mm;
    left: 14mm;
    right: 14mm;
    text-align: center;
}

.ballot-heading h1 {
    font-size: 15px;
    margin: 0 0 2mm;
}

.ballot-heading p {
    font-size: 9px;
    margin: 1mm 0;
}

.position-heading {
    position: absolute;
    left: 17mm;
    right: 15mm;
    font-size: 11px;
    font-weight: bold;
    border-bottom: 0.25mm solid #444;
    padding-bottom: 1mm;
}

.candidate-line {
    position: absolute;
    left: 18mm;
    right: 15mm;
    height: 6mm;
    display: flex;
    align-items: flex-start;
    gap: 4mm;
    font-size: 10px;
}

.omr-bubble {
    display: block;
    flex: 0 0 5mm;
    width: 5mm;
    height: 5mm;
    border: 0.4mm solid #000;
    border-radius: 50%;
}

.registration-mark {
    position: absolute;
    width: 3mm;
    height: 3mm;
    background: black;
}

@media (max-width: 900px) {
    .layout {
        grid-template-columns: 1fr;
    }
}

@page {
    size: A4 portrait;
    margin: 0;
}

@media print {
    body * {
        visibility: hidden !important;
    }

    #ballotPage,
    #ballotPage * {
        visibility: visible !important;
    }

    html,
    body {
        margin: 0 !important;
        padding: 0 !important;
        width: 210mm !important;
        height: 297mm !important;
        background: white !important;
    }

    header,
    .no-print,
    .controls,
    .preview-title {
        display: none !important;
    }

    .layout,
    .panel,
    .preview {
        display: block !important;
        margin: 0 !important;
        padding: 0 !important;
        border: 0 !important;
        box-shadow: none !important;
        background: transparent !important;
        width: 210mm !important;
        max-width: none !important;
        overflow: visible !important;
    }

    #ballotPage {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 210mm !important;
        height: 297mm !important;
        margin: 0 !important;
        padding: 0 !important;
        box-shadow: none !important;
        overflow: hidden !important;
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
    }

    .ballot-half {
        width: 210mm !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: hidden !important;
    }

    .ballot-half.full {
        height: 297mm !important;
    }
}
</style>
</head>

<body>

<header>OMR Ballot Creator</header>

<main class="layout">

    <section class="panel controls no-print">

        <h2>Ballot Settings</h2>

        <label for="titleInput">
            Ballot Title
        </label>

        <input
            id="titleInput"
            placeholder="Student Council Election"
        >

        <label for="yearInput">
            Academic Year
        </label>

        <input
            id="yearInput"
            value="2026-2027"
        >

        <label for="instructionsInput">
            Voting Instructions
        </label>

        <textarea
            id="instructionsInput"
            rows="3"
        >Shade the circle beside your chosen candidate completely.</textarea>

        <label for="copiesInput">
            Ballots Per A4 Paper
        </label>

        <select id="copiesInput">
            <option value="1">
                1 Ballot per A4
            </option>
            <option value="2" selected>
                2 Ballots per A4
            </option>
        </select>

        <h3>Maximum Votes Per Position</h3>

        <div id="positionSettings"></div>

        <h3>Loaded Candidates</h3>

        <div id="loadedCandidates">
            Loading...
        </div>

        <div class="buttons">

            <button
                id="reloadButton"
                class="secondary"
                type="button"
            >
                Reload Database
            </button>

            <button
                id="saveButton"
                class="primary"
                type="button"
            >
                Save Ballot
            </button>

            <button
                id="printButton"
                class="secondary"
                type="button"
            >
                Print Ballots
            </button>

        </div>

        <p id="status" role="status"></p>

    </section>

    <section class="panel">

        <h2 class="preview-title">
            Live A4 Ballot Preview
        </h2>

        <div class="preview">
            <div id="ballotPage"></div>
        </div>

    </section>

</main>

<script src="./ballot.js?v=20261014-2"></script>
<script src="./ballot_create.js?v=20261014-2"></script>

</body>
</html>
