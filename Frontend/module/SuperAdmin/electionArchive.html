
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>CampusVote | Election Archive</title>

<style>
:root {
    font-family: Inter, Arial, sans-serif;
    color: #252a34;
    background: #f5f6f8;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
}

header {
    background: #801224;
    color: white;
    padding: 22px 5%;
}

main {
    max-width: 1100px;
    margin: 30px auto;
    padding: 0 18px;
}

.card {
    background: white;
    border: 1px solid #e1e4e9;
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 22px;
}

h1 {
    margin: 0;
    font-size: 24px;
}

h2 {
    margin: 0 0 14px;
    font-size: 19px;
}

.muted {
    color: #667085;
    font-size: 13px;
}

label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
}

input,
select {
    width: 100%;
    padding: 11px;
    border: 1px solid #ccd2dc;
    border-radius: 7px;
    background: white;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 15px;
}

button {
    border: 0;
    background: #801224;
    color: white;
    padding: 10px 15px;
    border-radius: 7px;
    font-weight: 600;
    cursor: pointer;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.secondary {
    background: #e8ebf0;
    color: #202632;
}

.danger {
    background: #a3202c;
}

.actions {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    margin-top: 16px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    text-align: left;
    padding: 13px;
    border-bottom: 1px solid #e5e7eb;
    font-size: 13px;
}

th {
    background: #f7f8fa;
}

.scroll {
    overflow: auto;
}

.msg {
    margin-top: 12px;
    min-height: 20px;
}

a {
    color: inherit;
}

@media (max-width: 650px) {
    .grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <h1>CampusVote · Election Archive</h1>
    <div style="font-size:13px;margin-top:8px">
        Super Admin only
    </div>
</header>

<main>

    <!-- CREATE NEW ELECTION -->
    <div class="card">

        <h2>Create new election</h2>

        <p class="muted">
            Archive the current completed election first.
            New elections start without candidates or votes.
        </p>

        <form id="createForm">

            <div class="grid">

                <div>
                    <label for="title">
                        Election title
                    </label>

                    <input
                        id="title"
                        maxlength="150"
                        placeholder="Student Council Election 2027"
                        required>
                </div>

                <div>
                    <label for="copy">
                        Positions
                    </label>

                    <select id="copy">
                        <option value="">
                            Start with no positions
                        </option>
                    </select>
                </div>

                <div>
                    <label for="start">
                        Starting date & time
                    </label>

                    <input
                        id="start"
                        type="datetime-local"
                        required>
                </div>

                <div>
                    <label for="end">
                        Closing date & time
                    </label>

                    <input
                        id="end"
                        type="datetime-local"
                        required>
                </div>

            </div>

            <div class="actions">

                <button type="submit">
                    Create new election
                </button>

                <button
                    type="button"
                    class="secondary"
                    id="reload">
                    Refresh
                </button>

            </div>

        </form>

        <p
            id="message"
            class="msg"
            role="status">
        </p>

    </div>

    <!-- ELECTION HISTORY -->
    <div class="card">

        <h2>Election history</h2>

        <div class="scroll">

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Election</th>
                        <th>Status</th>
                        <th>Positions</th>
                        <th>Candidates</th>
                        <th>Ballots scanned</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="history">
                    <tr>
                        <td colspan="7">
                            Loading...
                        </td>
                    </tr>
                </tbody>

            </table>

        </div>

    </div>

</main>

<script src="./electionArchive.js"></script>

</body>
</html>
