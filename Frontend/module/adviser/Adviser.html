<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adviser Dashboard - MSEUF-CI Election System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-serif-title { font-family: 'Cinzel', serif; }
    .font-mono-id { font-family: 'Space Mono', monospace; }
  </style>
</head>

<body class="min-h-screen w-full bg-cover bg-center bg-no-repeat text-gray-800 font-sans antialiased flex flex-col"
  style="background-image: url('../image/bg5.jpg');">

  <!-- ==================== HEADER ==================== -->
  <header class="sticky top-0 z-50 w-full bg-[#7a0000] border-b border-black/20 py-4 px-4 sm:px-8 flex items-center gap-3 shadow-md shrink-0">
    <a href="Adviserlogin.html" class="text-white hover:opacity-80 transition shrink-0" aria-label="Back">
      <svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m12 19-7-7 7-7"></path>
        <path d="M19 12H5"></path>
      </svg>
    </a>
    <h1 class="text-xl sm:text-2xl font-serif font-bold text-white leading-none">Adviser Dashboard</h1>
  </header>

  <!-- ==================== MAIN BODY ==================== -->
  <main class="w-full max-w-[1400px] mx-auto flex flex-col md:flex-row gap-6 p-4 sm:p-6 min-h-screen pb-16">

    <!-- 1. KALIWANG CONTAINER -->
    <div class="w-full min-w-0 md:flex-[2.5] bg-[#efefef] rounded-2xl sm:rounded-3xl shadow-2xl flex flex-col border border-white/20 order-1 overflow-hidden">
      
      <!-- NAVIGATION TABS -->
      <nav class="w-full bg-[#e8e6e6] pt-4 pb-3.5 px-6 border-b border-gray-300/80 flex items-center justify-center gap-8 sm:gap-12 shrink-0">
        <a href="Adviser.html" class="flex items-center gap-2 text-slate-800 hover:text-black font-serif text-sm sm:text-base font-semibold transition">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 text-[#8f0000] shrink-0">
            <path stroke-linecap="round" stroke-linejoin="round" d="M18 7.5v3m0 0v3m0-3h3m-3 0h-3m-2.25-4.125a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0ZM3 19.235v-.11a6.375 6.375 0 0 1 12.75 0v.109A12.318 12.318 0 0 1 9.374 21c-2.331 0-4.512-.645-6.374-1.766Z" />
          </svg>
          <span>Candidate Management</span>
        </a>

        <a href="elecmanagement.html" class="flex items-center gap-2 text-slate-700 hover:text-black font-serif text-sm sm:text-base font-medium transition">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 text-[#8f0000] shrink-0">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
          </svg>
          <span>Election Management</span>
        </a>
      </nav>

      <!-- INNER WRAPPER -->
      <div class="p-5 sm:p-8 space-y-8 flex-1 flex flex-col">

        <!-- Add New Candidate Section -->
        <section class="w-full flex flex-col gap-3">
          <h2 class="text-2xl sm:text-[26px] font-bold text-gray-950 font-sans tracking-tight">Add New Candidate</h2>

          <form id="addCandidateForm" onsubmit="handleCandidateSubmit(event)" class="w-full bg-[#dedede]/70 border border-gray-300 rounded-2xl p-5 sm:p-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
              
              <!-- Full Name -->
              <div class="flex flex-col gap-1.5">
                <label class="text-xs sm:text-sm font-bold text-gray-800">Full Name:</label>
                <input 
                  type="text" 
                  id="candFullName" 
                  required 
                  placeholder="Enter Candidate name"
                  class="w-full bg-[#e3dddd] hover:bg-white focus:bg-white border border-gray-400 rounded-xl px-4 py-2.5 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-[#8f0000] shadow-inner transition"
                />
              </div>

              <!-- Course -->
              <div class="flex flex-col gap-1.5">
                <label class="text-xs sm:text-sm font-bold text-gray-800">Course:</label>
                <input 
                  type="text" 
                  id="candCourse" 
                  required 
                  placeholder="Ex. BSCS"
                  class="w-full bg-[#e3dddd] hover:bg-white focus:bg-white border border-gray-400 rounded-xl px-4 py-2.5 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-[#8f0000] shadow-inner transition"
                />
              </div>

              <!-- Grade Level -->
              <div class="flex flex-col gap-1.5">
                <label class="text-xs sm:text-sm font-bold text-gray-800">Grade Level:</label>
                <select 
                  id="candGrade" 
                  required
                  class="w-full bg-[#e3dddd] hover:bg-white focus:bg-white border border-gray-400 rounded-xl px-4 py-2.5 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-[#8f0000] shadow-inner transition"
                >
                  <option value="" disabled selected>Select grade Level</option>
                  <option value="1">1st Year</option>
                  <option value="2">2nd Year</option>
                  <option value="3">3rd Year</option>
                  <option value="4">4th Year</option>
                </select>
              </div>

              <!-- Party List -->
              <div class="flex flex-col gap-1.5">
                <label class="text-xs sm:text-sm font-bold text-gray-800">Party List :</label>
                <input 
                  type="text" 
                  id="candParty" 
                  required 
                  placeholder="Ex. Maroon"
                  class="w-full bg-[#e3dddd] hover:bg-white focus:bg-white border border-gray-400 rounded-xl px-4 py-2.5 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-[#8f0000] shadow-inner transition"
                />
              </div>

              <!-- Position Dropdown -->
              <div class="flex flex-col gap-1.5">
                <label class="text-xs sm:text-sm font-bold text-gray-800">Position:</label>
                <select 
                  id="candPosition" 
                  required
                  class="w-full bg-[#e3dddd] hover:bg-white focus:bg-white border border-gray-400 rounded-xl px-4 py-2.5 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-[#8f0000] shadow-inner transition"
                >
                  <option value="" disabled selected>Select Position</option>
                </select>
              </div>

              <!-- Submit Button -->
              <div class="flex items-end">
                <button 
                  type="submit" 
                  class="w-full bg-[#800000] hover:bg-[#600000] text-white font-bold text-sm sm:text-base py-2.5 px-6 rounded-xl shadow-md transition active:scale-95 text-center"
                >
                  Add Candidate
                </button>
              </div>

            </div>
          </form>
        </section>

        <!-- Registered Candidate Section -->
        <section class="w-full flex flex-col gap-3">
          <h2 class="text-2xl sm:text-[26px] font-bold text-gray-950 font-sans tracking-tight">Registered Candidate</h2>

          <div class="w-full overflow-hidden rounded-2xl shadow-sm border border-red-900/30">
            <div class="w-full overflow-x-auto max-h-[460px] bg-white">
              <table class="w-full text-left border-collapse min-w-[550px]">
                <thead class="bg-[#8f0000] text-white sticky top-0 z-10">
                  <tr>
                    <th class="py-3 px-4 font-serif text-[15px] whitespace-nowrap">Full Name</th>
                    <th class="py-3 px-4 font-serif text-[15px] whitespace-nowrap">Course</th>
                    <th class="py-3 px-4 font-serif text-[15px] whitespace-nowrap">Grade Level</th>
                    <th class="py-3 px-4 font-serif text-[15px] whitespace-nowrap">Party List</th>
                    <th class="py-3 px-4 font-serif text-[15px] whitespace-nowrap text-center">Action</th>
                  </tr>
                </thead>
                
                <tbody id="candidatesTableBody" class="text-sm text-gray-800">
                  <!-- Dynamic rows injected here -->
                </tbody>
              </table>
            </div>
          </div>
        </section>

      </div>
    </div>

    <!-- 2. KANANG CONTAINER: LIVE RESULTS SIDEBAR -->
    <aside class="w-full md:w-80 bg-[#efefef] rounded-2xl sm:rounded-3xl p-5 shadow-2xl shrink-0 flex flex-col border border-white/20 md:sticky md:top-24 self-start space-y-4 order-2">
      
      <div class="space-y-3">
        <h3 class="text-2xl font-serif font-bold text-gray-950 leading-tight">Live Results</h3>
        
        <!-- Bars -->
        <div id="dynamicSidebarPositions" class="flex flex-col gap-2"></div>
      </div>

      <!-- STATUS FOOTER -->
      <div class="border-t border-gray-300 pt-3 mt-4 text-[13px] text-gray-800 space-y-1">
        <h4 class="text-sm font-serif font-bold text-gray-950 mb-1">Status</h4>
        <div class="flex justify-between font-medium">
          <span>No.Voters:</span>
          <span id="No.voters" class="text-gray-500 truncate max-w-[130px] text-right">Database not f...</span>
        </div>
        <div class="flex justify-between font-medium">
          <span>Voted :</span>
          <span id="Voted" class="text-gray-500 truncate max-w-[130px] text-right">0</span>
        </div>
        <div class="flex justify-between font-medium">
          <span>No.Candidate:</span>
          <span id="No.candidates" class="text-gray-500 truncate max-w-[130px] text-right">0</span>
        </div>
      </div>

    </aside>

  </main>

  <!-- ==================== JAVASCRIPT SYNC ENGINE ==================== -->
 <script>
  const BALLOT_STORAGE_KEY = 'ballot_config';
  const RESULTS_STORAGE_KEY = 'election_results';

  function getBallotState() {
    try {
      const raw = localStorage.getItem(BALLOT_STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {
      console.warn('Could not parse ballot_config', e);
    }
    return {
      ballotId: 'MSEUFCI-2026',
      title: 'MSEUF-CI Student Council Election 2026',
      academicYear: '2026-2027',
      positions: [
        { id: 'pos-pres', name: 'President', maxChoices: 1, candidates: [] },
        { id: 'pos-vp', name: 'Vice-President', maxChoices: 1, candidates: [] },
        { id: 'pos-sec', name: 'Senator', maxChoices: 4, candidates: [] }
      ]
    };
  }

  function saveBallotState(state) {
    localStorage.setItem(BALLOT_STORAGE_KEY, JSON.stringify(state));
    window.dispatchEvent(new Event('storage'));
    window.dispatchEvent(new Event('ballotUpdated'));
  }

  function updatePositionDropdown() {
    const select = document.getElementById('candPosition');
    if (!select) return;
    const state = getBallotState();

    const previousSelection = select.value;
    select.innerHTML = '<option value="" disabled selected>Select Position</option>';

    state.positions.forEach(pos => {
      const opt = document.createElement('option');
      opt.value = pos.id;
      opt.textContent = pos.name;
      select.appendChild(opt);
    });

    if (previousSelection) select.value = previousSelection;
  }

  function handleCandidateSubmit(e) {
    e.preventDefault();

    const fullName = document.getElementById('candFullName').value.trim();
    const course = document.getElementById('candCourse').value.trim();
    const grade = document.getElementById('candGrade').value;
    const party = document.getElementById('candParty').value.trim();
    const positionId = document.getElementById('candPosition').value;

    if (!fullName || !positionId) return;

    const state = getBallotState();
    const targetPosition = state.positions.find(p => p.id === positionId);

    if (!targetPosition) {
      alert('Selected position not found.');
      return;
    }

    const newCandidate = {
      id: 'cand-' + Date.now().toString(36),
      name: fullName,
      course: course,
      grade: grade,
      party: party
    };

    targetPosition.candidates.push(newCandidate);
    saveBallotState(state);

    document.getElementById('candFullName').value = '';
    document.getElementById('candCourse').value = '';
    document.getElementById('candGrade').selectedIndex = 0;
    document.getElementById('candParty').value = '';

    renderAllViews();
  }

  function deleteCandidate(positionId, candidateId) {
    if (!confirm('Are you sure you want to remove this candidate?')) return;

    const state = getBallotState();
    const position = state.positions.find(p => p.id === positionId);
    if (!position) return;

    position.candidates = position.candidates.filter(c => c.id !== candidateId);
    saveBallotState(state);
    renderAllViews();
  }

  function renderAllViews() {
    const state = getBallotState();
    let tally = null;
    try {
      tally = JSON.parse(localStorage.getItem(RESULTS_STORAGE_KEY));
    } catch (e) {}

    const tableBody = document.getElementById('candidatesTableBody');
    const sidebar = document.getElementById('dynamicSidebarPositions');
    const votedCountEl = document.getElementById('Voted');
    const candCountEl = document.getElementById('No.candidates');

    let totalCandidateCount = 0;

    // 1. Table Render (Registered Candidates)
    if (tableBody) {
      if (!state.positions.length) {
        tableBody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-gray-400 font-serif">No positions created yet.</td></tr>`;
      } else {
        let tableRows = '';
        state.positions.forEach(pos => {
          tableRows += `
            <tr class="bg-[#efefef] text-black font-serif font-bold text-xs border-t border-b border-gray-300">
              <td colspan="5" class="py-2.5 px-4 text-[16px]">${escapeHtml(pos.name)}:</td>
            </tr>
          `;

          if (!pos.candidates || !pos.candidates.length) {
            tableRows += `
              <tr class="bg-white/80 border-b border-gray-200">
                <td colspan="5" class="py-2.5 px-4 text-xs italic text-gray-400">No registered candidates for this position.</td>
              </tr>
            `;
          } else {
            pos.candidates.forEach((cand, idx) => {
              totalCandidateCount++;
              const isEven = idx % 2 === 0;
              const rowClass = isEven ? 'bg-[#8f0000] text-[#efefef]' : 'bg-[#efefef] text-gray-900';
              const btnClass = isEven ? 'bg-white/20 hover:bg-white/30 text-white' : 'bg-[#8f0000] hover:bg-[#710000] text-white';

              tableRows += `
                <tr class="${rowClass} border-b border-gray-200 transition-colors">
                  <td class="py-2.5 px-4 font-serif text-[15px] whitespace-nowrap">${escapeHtml(cand.name)}</td>
                  <td class="py-2.5 px-4 font-serif text-[15px] whitespace-nowrap">${escapeHtml(cand.course || 'BSCS')}</td>
                  <td class="py-2.5 px-4 font-serif text-[15px] whitespace-nowrap">${escapeHtml(cand.grade || '1')}</td>
                  <td class="py-2.5 px-4 font-serif text-[15px] whitespace-nowrap">${escapeHtml(cand.party || 'Independent')}</td>
                  <td class="py-2.5 px-4 text-center">
                    <button onclick="deleteCandidate('${pos.id}', '${cand.id}')" title="Delete Candidate" class="p-1.5 rounded ${btnClass} transition">
                      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-4 h-4">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
                      </svg>
                    </button>
                  </td>
                </tr>
              `;
            });
          }
        });
        tableBody.innerHTML = tableRows;
      }
    }

    // 2. Sidebar Render (Live Results - Palaging may Pangalan)
    if (sidebar) {
      sidebar.innerHTML = state.positions.map((pos, pIdx) => {
        const posTally = (tally && tally.positions && tally.positions[pos.id]) ? tally.positions[pos.id] : null;

        const candidateData = (pos.candidates || []).map(c => ({
          id: c.id,
          name: c.name,
          votes: (posTally && posTally.candidates && posTally.candidates[c.id]) ? posTally.candidates[c.id].votes : 0
        }));

        const totalVotesInPos = candidateData.reduce((sum, c) => sum + c.votes, 0);

        const barsHTML = candidateData.map(c => {
          const percent = totalVotesInPos > 0 ? Math.round((c.votes / totalVotesInPos) * 100) : 0;
          return `
            <div class="candidate-row flex flex-col w-full" data-candidate-id="${escapeHtml(c.id)}">
              <!-- Pangalan sa kaliwa, Porsyento sa kanan -->
              <div class="flex justify-between items-center text-xs sm:text-sm font-serif font-semibold text-gray-800 leading-none mb-1">
                <span class="truncate pr-2">${escapeHtml(c.name)}</span>
                <span class="font-mono text-gray-900 shrink-0">${percent}%</span>
              </div>
              <div class="w-full bg-gray-400/60 h-3 sm:h-3.5 rounded-full overflow-hidden shadow-inner">
                <div class="bg-[#8f0000] h-full rounded-full transition-all duration-500 ease-out" style="width: ${percent}%;"></div>
              </div>
            </div>
          `;
        }).join('');

        return `
          <div class="position-section flex flex-col ${pIdx > 0 ? 'mt-2' : ''} gap-1.5 w-full" data-position="${escapeHtml(pos.name)}">
            <div class="pl-1">
              <h4 class="text-[18px] sm:text-[20px] font-serif font-bold text-gray-900 leading-tight">
                ${escapeHtml(pos.name)}
              </h4>
            </div>
            <div class="candidates-list flex flex-col gap-2 pl-2 w-full">
              ${barsHTML || '<div class="text-[11px] text-gray-400 italic pl-1">No candidates yet</div>'}
            </div>
          </div>
        `;
      }).join('');
    }

    // 3. Status Footer Update
    if (votedCountEl) votedCountEl.textContent = (tally && tally.totalScanned ? tally.totalScanned : 0).toLocaleString();
    if (candCountEl) candCountEl.textContent = totalCandidateCount.toLocaleString();
  }

  function escapeHtml(str) {
    return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  window.addEventListener('storage', (e) => {
    if (e.key === BALLOT_STORAGE_KEY || e.key === RESULTS_STORAGE_KEY) {
      updatePositionDropdown();
      renderAllViews();
    }
  });

  window.addEventListener('ballotUpdated', () => {
    updatePositionDropdown();
    renderAllViews();
  });

  document.addEventListener('DOMContentLoaded', () => {
    lucide.createIcons();
    updatePositionDropdown();
    renderAllViews();
    setInterval(renderAllViews, 2000);
  });
</script>
</body>
</html>
