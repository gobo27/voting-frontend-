<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password | CampusVote</title>
    <link rel="stylesheet" href="../../dist/output.css">
    <link rel="stylesheet" href="../sheared/change_password.css">
</head>

<body>

    <header class="top">
        <h1>CampusVote</h1>
        <p>Secure Account Setup</p>
    </header>

    <main>

        <section class="card">

            <div class="symbol">🔒</div>

            <h2>Change Password</h2>

            <p class="description">
                Set your own password to activate
                your account.
            </p>

            <form id="changeForm">

                <label for="newPassword">
                    New Password
                </label>

                <input type="password" id="newPassword" name="newPassword" autocomplete="new-password" minlength="12"
                    maxlength="128" placeholder="At least 12 characters" required>

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password"
                    minlength="12" maxlength="128" placeholder="Confirm new password" required>
                <p class="hint">
                    Use 12–128 characters.
                    Choose a password different
                    from your temporary password.
                </p>
                <p id="message" role="alert" aria-live="polite"></p>
                <button type="submit" id="saveButton">
                    Update Password
                </button>
            </form>
            <button type="button" class="back" id="backToLogin">
                Back to Login
            </button>
        </section>
    </main>
    <script src="../sheared/toast.js"></script>
    <script src="./change_password.js"></script>
</body>
</html>
