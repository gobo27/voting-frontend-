<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MSEUF-CI Election System</title>
  <link href="./dist/output.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; overflow-x: hidden; }

    /* FLEXIBLE LAYOUT */
    .landing-page {
      position: relative;
      min-height: 100vh;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .landing-background {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    /* LEFT PANEL */
    .left-panel {
      position: relative;
      z-index: 1;
      background: rgba(128, 0, 0, 0.93);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: clamp(24px, 5vw, 50px);
      color: white;
    }

    .school-logo {
      width: clamp(90px, 18vw, 170px);
      height: auto;
      object-fit: contain;
      margin-bottom: clamp(20px, 4vw, 45px);
    }

    .system-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(17px, 2.2vw, 30px);
      font-weight: bold;
      line-height: 1.3;
      max-width: 480px;
      margin: 0;
    }

    /* RIGHT PANEL */
    .right-panel {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: clamp(20px, 4vw, 50px);
    }

    /* WELCOME CARD */
    .welcome-card {
      width: 100%;
      max-width: 350px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 14px;
      padding: clamp(20px, 4vw, 28px);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.12);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .welcome-card h2 {
      font-family: Georgia, "Times New Roman", serif;
      color: #800000;
      font-size: clamp(22px, 5vw, 26px);
      font-weight: bold;
      margin: 0 0 6px;
    }

    .welcome-card p {
      color: #777;
      font-size: 13px;
      margin: 0 0 20px;
    }

    /* BUTTONS */
    .welcome-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .welcome-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: 48px;
      padding: 10px 16px;
      border-radius: 9px;
      text-decoration: none;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 14px;
      font-weight: bold;
      transition: background 0.2s, transform 0.2s;
    }

    .welcome-btn:hover {
      transform: translateY(-2px);
    }

    .sign-in {
      background: linear-gradient(110deg, #680000, #a32932);
      color: white;
      box-shadow: 0 4px 10px rgba(128, 0, 0, 0.15);
    }

    .sign-in:hover {
      background: #600000;
    }

    .live-dashboard {
      background: white;
      color: #333;
      border: 1px solid #e5e5e5;
      box-shadow: 0 3px 9px rgba(0, 0, 0, 0.05);
    }

    .live-dashboard:hover {
      background: #fbedee;
    }

    .btn-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      flex-shrink: 0;
    }

    .btn-icon svg {
      width: 20px;
      height: 20px;
    }

    .live-dashboard .btn-icon, .live-dashboard .btn-arrow {
      color: #800000;
    }

    .btn-arrow {
      margin-left: auto;
      display: flex;
      align-items: center;
    }

    .btn-arrow svg {
      width: 16px;
      height: 16px;
    }

    /* MOBILE BREAKPOINT (CELLPHONES & TABLETS) */
    @media (max-width: 850px) {
      .landing-page {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
        min-height: 100vh;
      }

      .left-panel {
        padding: 35px 20px 25px;
      }

      .right-panel {
        align-items: flex-start;
        padding: 24px 20px 40px;
      }
    }
  </style>
</head>
<body>

  <div class="landing-page">
    <img src="image/bg2.jpg" alt="School Background" class="landing-background">

    <div class="left-panel">
      <img src="image/logo.png" alt="School Logo" class="school-logo">
      <h1 class="system-title">
        Web Based School Election System
        with Digital Image Based Processing
        and Real-Time Analytical Report
      </h1>
    </div>

    <div class="right-panel">
      <div class="welcome-card">
        <h2>Welcome</h2>
        <p>Choose an option to continue</p>

        <div class="welcome-buttons">
          <a href="signin.html" class="welcome-btn sign-in">
            <span class="btn-icon">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10 17l5-5-5-5M15 12H3m9-9h7a2 2 0 012 2v14a2 2 0 01-2 2h-7" />
              </svg>
            </span>
            <span>Sign In</span>
            <span class="btn-arrow">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="m9 18 6-6-6-6"/>
              </svg>
            </span>
          </a>

          <a href="dashboard.html" class="welcome-btn live-dashboard">
            <span class="btn-icon">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 20V10h4v10M10 20V4h4v16M16 20v-8h4v8M2 20h20" />
              </svg>
            </span>
            <span>Live Dashboard</span>
            <span class="btn-arrow">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="m9 18 6-6-6-6"/>
              </svg>
            </span>
          </a>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
