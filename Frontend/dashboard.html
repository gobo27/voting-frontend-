<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Results - MSEUF Election System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --maroon: #801224;
      --maroon-dark: #650d1c;
      --background: #f6f7f9;
      --border: #e0e3e8;
      --muted: #747b87;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: #252a34;
      font-family: Inter, Arial, sans-serif;
    }

    .dashboard-header {
      background: var(--maroon);
      color: white;
      padding: 17px 35px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 2px 8px #00000012;
    }

    .back-link {
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity .2s;
    }

    .back-link:hover {
      opacity: .75;
    }

    .dashboard-logo {
      width: 43px;
      height: 43px;
      border-radius: 50%;
      object-fit: cover;
    }

    .dashboard-header h1 {
      margin: 0;
      font-size: 23px;
      font-weight: 700;
    }

    .dashboard-main {
      max-width: 1600px;
      margin: 0 auto;
      padding: 28px 35px 50px;
    }

    #statusBanner {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      border-radius: 10px;
      border: 1px solid #dce0e6;
      background: white;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 24px;
      box-shadow: 0 2px 7px #00000005;
      transition: background-color .2s, border-color .2s;
    }

    #statusIcon {
      font-size: 18px;
      flex-shrink: 0;
    }

    .results-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 18px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 23px 26px;
      margin-bottom: 18px;
      box-shadow: 0 3px 9px #00000004;
    }

    .results-heading h2 {
      font-size: 23px;
      font-weight: 700;
      margin: 0 0 7px;
      color: #252a34;
    }

    .results-subtitle {
      color: var(--muted);
      font-size: 13px;
      margin: 0;
    }

    .sort-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .sort-group label {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }

    .sort-wrapper {
      position: relative;
    }

    #sortSelect {
      appearance: none;
      background: #fbedee;
      color: var(--maroon);
      border: 1px solid #f0d9de;
      border-radius: 9px;
      padding: 12px 38px 12px 15px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      min-width: 205px;
    }

    #sortSelect:focus {
      border-color: var(--maroon);
    }

    .sort-arrow {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--maroon);
    }

    #resultsContainer {
      display: flex;
      flex-direction: column;
      gap: 18px;
      width: 100%;
    }

    #resultsContainer>div,
    #resultsContainer>section,
    #resultsContainer>article {
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 3px 12px #00000006;
      min-width: 0;
    }

    #resultsContainer h3 {
      color: #252a34;
      font-family: Inter, Arial, sans-serif;
      font-size: 18px;
      font-weight: 700;
    }

    #resultsContainer p,
    #resultsContainer span {
      font-family: Inter, Arial, sans-serif;
    }

    #resultsContainer button {
      cursor: pointer;
    }

    #resultsContainer .progress-bar,
    #resultsContainer .vote-progress {
      border-radius: 999px;
      overflow: hidden;
    }

    @media (max-width: 768px) {
      .dashboard-header {
        padding: 16px 20px;
      }

      .dashboard-header h1 {
        font-size: 19px;
      }

      .dashboard-logo {
        width: 36px;
        height: 36px;
      }

      .dashboard-main {
        padding: 20px 16px 35px;
      }

      .results-heading {
        padding: 20px;
      }

      .results-heading h2 {
        font-size: 21px;
      }

      #resultsContainer>div,
      #resultsContainer>section,
      #resultsContainer>article {
        padding: 18px;
      }
    }

    @media (max-width: 480px) {
      .sort-group {
        width: 100%;
        align-items: stretch;
        flex-direction: column;
      }

      .sort-wrapper,
      #sortSelect {
        width: 100%;
      }

      .results-heading {
        flex-direction: column;
        align-items: stretch;
      }
    }
    /* TOTAL COUNTED BALLOTS */

.ballot-counter {
    min-width: 205px;
    padding: 16px 20px;
    background: #fff5f6;
    border: 1px solid #efd7dc;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.ballot-counter-label {
    font-size: 12px;
    font-weight: 600;
    color: #801224;
}

#totalCountedBallots {
    font-size: 30px;
    font-weight: 800;
    color: #801224;
    line-height: 1.2;
}

.ballot-counter-note {
    font-size: 11px;
    color: #747b87;
}

@media (max-width: 480px) {
    .ballot-counter {
        width: 100%;
    }
}
  </style>
</head>

<body>
  <header class="dashboard-header">
    <a href="index.html" class="back-link" aria-label="Back">
      <svg xmlns="http://www.w3.org/2000/svg" width="29" height="29" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m12 19-7-7 7-7"></path>
        <path d="M19 12H5"></path>
      </svg>
    </a>
    <h1>Live Dashboard</h1>
  </header>

  <main class="dashboard-main">
    <div id="statusBanner">
      <span id="statusIcon">🔒</span>
      <span id="statusBannerText">Voting in Progress (Names Hidden)</span>
    </div>

    <div class="results-heading">
      <div>
        <h2>Live Results</h2>
        <p class="results-subtitle">Real-time election results from all students.</p>
      </div>
      <div class="ballot-counter">
        <span class="ballot-counter-label">Total Counted Ballots</span>
        <strong id="totalCountedBallots">0</strong>
        <span class="ballot-counter-note">Successfully scanned ballots</span>
      </div>
    </div>
    <div id="resultsContainer"></div>
  </main>

  <script src="dashboard.js"></script>
</body>

</html>
